services:
  # ScenarioLab Production Web Service (FastAPI + Unified Frontend)
  - type: web
    name: scenariolab-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt && python scripts/seed.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_U8h9BPzHxnOR@ep-wispy-surf-aern98ft-pooler.c-2.us-east-2.aws.neon.tech/neondb?ssl=require"
      - key: DEFAULT_LLM_PROVIDER
        value: "nvidia"
      - key: NVIDIA_API_KEY
        value: "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"
      - key: NVIDIA_MODEL
        value: "meta/llama-3.2-11b-vision-instruct"
      - key: DEFAULT_VOICE_PROVIDER
        value: "edge_tts"
