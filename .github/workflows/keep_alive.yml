name: Multi-Cloud 24/7 Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 10 minutes to prevent Render/Koyeb/HuggingFace from ever idling or sleeping
    - cron: '*/10 * * * *'
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  keepalive-ping:
    name: Ping All Backend & Frontend Nodes
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Multi-Cloud Endpoints
        run: |
          ENDPOINTS=(
            "https://scenariolab-api.onrender.com/health/ready"
            "${{ secrets.HF_BACKEND_URL || '' }}"
            "${{ secrets.KOYEB_BACKEND_URL || '' }}"
            "${{ secrets.ORACLE_BACKEND_URL || '' }}"
            "https://scenariolab-alpha.vercel.app"
          )

          for url in "${ENDPOINTS[@]}"; do
            if [ -n "$url" ]; then
              echo "----------------------------------------"
              echo "Pinging: $url"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 25 "$url" || echo "000")
              echo "HTTP Status: $STATUS"
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "308" ]; then
                echo "✅ Healthy & Awake"
              else
                echo "⚠️ Wake-up packet sent (code $STATUS)"
              fi
            fi
          done
