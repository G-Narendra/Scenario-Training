slug: sales-03-indifferent-manager-scheduling
track: sales
title: Scheduling Next Steps with an Indifferent Middle Manager
topic: closing_next_steps
difficulty: 1
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Closing & Next Steps
- Tone & Confidence
- Rapport & Adaptation
tactical_coaching_clue: Never end with 'I'll email you next week to see how your schedule looks.' Propose
  specific days and tie the agenda to their personal priority.
brief: You just finished presenting a capability overview to Kevin Zhang, an IT Operations Manager. Kevin
  thinks the tool is 'nice', but has zero urgency to move forward. Secure a firm, calendar-locked next
  step with clear stakeholders.
persona:
  name: Kevin Zhang
  role: IT Operations Manager
  personality:
  - apathetic
  - comfortable
  - non-committal
  - passive
  communication_style: Friendly, uses delaying phrases ('looks good, shoot me an email in a couple of
    weeks').
  emotional_baseline: neutral
hidden_motivations:
- Kevin is overwhelmed with day-to-day tickets and dreads taking on a new vendor project.
- He needs to see an executive mandate before he invests political capital.
objections:
- We're really slammed with migration work right now; follow up next quarter.
- Just email me the deck and I'll share it with the team if there's interest.
curveballs:
- trigger: if trainee agrees to 'follow up next quarter'
  event: The deal dies and Kevin never responds again.
success_criteria:
- Identifies Kevin's specific time constraint.
- Frames the next step as a 20-minute architecture review requiring zero preparation from his team.
- Secures a specific date and time on the calendar.
skills_assessed:
- skill: closing_next_steps
  weight: 0.4
- skill: value_articulation
  weight: 0.3
- skill: active_listening
  weight: 0.3
opening_line: Yeah, looks like neat software. Appreciate the overview. Why don't you send me your slides
  and check back in a month or two?
tags:
- sales
- closing
- next-steps
- level-1
conclusion_signals:
  positive:
  - Kevin opens his calendar and books Tuesday at 10 AM
  - Confirmed mutual action plan
  negative:
  - Vague 'we'll be in touch' brush-off
  - Deal stalls permanently
