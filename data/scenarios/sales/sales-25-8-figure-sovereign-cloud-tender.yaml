- He needs guaranteed customer-held hardware encryption keys (HSM) that foreign courts cannot subpoena.
objections:
- Your competitor's intelligence dossier claims that under the US CLOUD Act, your government can seize
  our citizen health records.
- We require zero-knowledge cryptographic air-gapping on sovereign territory, with our military holding
  the root keys.
