brief: You are in the final diplomatic session with Minister of Digital Transformation David Al-Mansoor
  for a $24M Sovereign National Data Cloud tender. A rival foreign vendor claims your cloud architecture
  allows US CLOUD Act data access. Defend your sovereign encryption architecture and close the national
  tender.
persona:
