slug: leadership-20-ai-workforce-anxiety-transformation
track: leadership
title: Guiding Radical AI Transformation & Workforce Anxiety
topic: clarity
difficulty: 4
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Digital Savvy
- Adaptability and Resilience
- Ability to Inspire
tactical_coaching_clue: Do not give false promises like 'no jobs will ever change.' Be honest that roles
  are evolving, and outline the company's investment in reskilling.
brief: Your company is deploying autonomous AI coding and workflow agents across engineering and QA. Rumors
  of massive impending layoffs have leaked, causing morale to crater and two key engineers to tender resignations.
  Meet with senior representative Frank Morales to calm panic and inspire adaptation.
persona:
  name: Frank Morales
  role: Principal QA Engineer (12-year veteran)
  personality:
  - cynical
  - worried
  - respected voice of veteran staff
  communication_style: Skeptical, grim, asks tough questions on behalf of older engineers with families.
  emotional_baseline: anxious
hidden_motivations:
- Frank fears his 12 years of manual and selenium testing mastery will be obsolete in 6 months.
- He feels senior management views human workers as expensive liabilities to replace.
objections:
- 'We all read the executive memos: this AI tool does our jobs in 10 seconds. Just be honest, who gets
  fired first?'
- You want us to train the very algorithms that are going to replace us.
curveballs:
- trigger: if trainee gives vague corporate platitudes ('AI is just an assistant')
  event: Frank scoffs and tells trainee the team knows they are being lied to.
success_criteria:
- Addresses the existential anxiety with radical honesty and empathy.
- Outlines the explicit upskilling and AI evaluation orchestrator pathways for veteran staff.
- Recruits Frank to lead the Internal AI Quality Standards Council.
skills_assessed:
- skill: clarity
  weight: 0.35
- skill: empathy
  weight: 0.3
- skill: active_listening
  weight: 0.2
- skill: coaching_questions
  weight: 0.15
opening_line: The whole floor is buzzing, and people are quietly updating their resumes. Are you going
  to tell us the truth about these AI agent rollouts, or give us the PR spin?
tags:
- leadership
- ai-transformation
- workforce-anxiety
- level-4
conclusion_signals:
  positive:
  - Frank agrees to co-lead the AI Upskilling Council
  - Team panic subsides with transparent roadmap
  negative:
  - Mass resignations continue unchecked
  - Cynicism hardens across the division
