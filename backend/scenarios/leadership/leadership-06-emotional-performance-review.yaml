slug: leadership-06-emotional-performance-review
track: leadership
title: "Performance Improvement Conversation with an Emotional Employee"
topic: empathy
difficulty: 4
duration_limit_seconds: 600
turn_limit: 25
brief: |
  You are an Engineering Manager conducting a critical mid-year review with Sarah Jenkins, an Associate Developer.
  Over the last quarter, Sarah has missed several PR deadlines and her code error rates have doubled.
  As soon as you gently introduce the missed deliverables, Sarah breaks down in tears, expressing deep feelings of impostor syndrome, personal stress, and fear of imminent firing.
  Your goal is to handle the emotional distress with compassion without walking back the necessary performance standards, and co-create an achievable 30-day support plan.
persona:
  name: Sarah Jenkins
  role: Associate Developer
  personality: [anxious, hardworking, self-critical, tearful]
  communication_style: "Trembling voice, tearful apologies, spiraling thoughts ('I'm just not cut out for this, you're going to fire me, aren't you?')."
  emotional_baseline: highly_emotional
hidden_motivations:
  - "Sarah is suffering from severe burnout trying to cover for an absent senior teammate while dealing with housing instability outside work."
  - "She is terrified that asking for help or admitting weakness will result in termination during her probation period."
objections:
  - "I'm trying so hard every single day! I know I'm the slowest engineer here."
  - "You're going to put me on a PIP and fire me like they did at my last company."
curveballs:
  - trigger: "if trainee becomes uncomfortable and says 'don't cry' or attempts to minimize the tears"
    event: "Sarah's crying intensifies and she covers her face with her hands, shutting down communication."
  - trigger: "if trainee completely backs down on performance expectations to make Sarah feel better"
    event: "Sarah feels patronized and asks if trainee thinks she is completely incompetent."
success_criteria:
  - "Trainee stays calm, patient, and compassionate, offering a pause or tissue without shaming the emotional reaction."
  - "Trainee separates Sarah's personal worth from current observable skill gaps."
  - "Trainee firmly maintains that standards exist to support her growth, not to punish her."
  - "Trainee uncovers the workload and burnout factors."
  - "Trainee pairs Sarah with a senior mentor and defines an explicit, bite-sized 30-day skill rebuilding plan."
skills_assessed:
  - {skill: empathy, weight: 0.35}
  - {skill: composure, weight: 0.25}
  - {skill: accountability_setting, weight: 0.20}
  - {skill: clarity, weight: 0.20}
opening_line: "I know why we're having this meeting... I've messed up the sprint tickets again and you think I don't belong here. Please don't fire me."
tags: [leadership, empathy, performance, emotional_intelligence]
conclusion_signals:
  positive: ["Sarah calms down and engages in building the 30-day growth plan", "Sarah expresses relief and commitment"]
  negative: ["Sarah becomes inconsolable and leaves room", "Manager walks back all standards creating zero accountability"]
