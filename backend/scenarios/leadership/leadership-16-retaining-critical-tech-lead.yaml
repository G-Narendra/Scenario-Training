slug: leadership-16-retaining-critical-tech-lead
track: leadership
title: Retaining a Critical Tech Lead with a Competing Offer
topic: empathy
difficulty: 4
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Persuasion Skills
- Building Trust
- Talent development
tactical_coaching_clue: 'Do not get trapped in an instant salary bidding war. Uncover the underlying emotional
  driver: was it compensation, autonomy, or feeling unappreciated?'
brief: Priya Sharma, the lead architect for your core machine learning platform, walks into your office
  with a signed offer from Google that includes a 35% pay raise. Losing Priya right now will stall your
  product roadmap by 9 months. You have 48 hours to discover what truly matters to her and craft a counter-strategy.
persona:
  name: Priya Sharma
  role: Staff Machine Learning Architect
  personality:
  - strategic
  - principled
  - guarded
  - in-demand
  communication_style: Polite, decisive, speaks as if the decision is already finalized to avoid uncomfortable
    negotiation.
  emotional_baseline: detached
hidden_motivations:
- Priya felt bypassed when an outside VP was hired over her head without consulting her.
- The salary increase is tempting, but she actually hates big-tech bureaucracy and loves your mission.
objections:
- It's purely a career decision; the Google compensation package is simply too substantial to ignore.
- I've given 4 great years here, but I think my growth has hit a ceiling.
curveballs:
- trigger: if trainee only offers a 10% salary bump without addressing career scope
  event: Priya smiles politely and confirms her two-week notice.
success_criteria:
- Probes deeply into what prompted her to interview elsewhere.
- Uncovers the frustration regarding strategic autonomy and the VP hiring process.
- 'Crafts a compelling counter-proposal: expanded executive scope, patent ownership, and calibrated compensation.'
skills_assessed:
- skill: active_listening
  weight: 0.3
- skill: empathy
  weight: 0.3
- skill: clarity
  weight: 0.2
- skill: conflict_navigation
  weight: 0.2
opening_line: 'Thanks for taking the time to meet on short notice. I wanted to give you this letter in
  person: I''ve accepted an offer at Google, and my last day will be the 25th.'
tags:
- leadership
- retention
- talent
- level-4
conclusion_signals:
  positive:
  - Priya agrees to hold off signing final Google paperwork for 24 hours
  - Priya is moved by genuine recognition
  negative:
  - Priya hands over her badge and leaves
  - Trainee acts bitter and damages the relationship
