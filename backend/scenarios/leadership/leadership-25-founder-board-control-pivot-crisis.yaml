slug: leadership-25-founder-board-control-pivot-crisis
track: leadership
title: Founder vs Board Control & Strategic Pivot Crisis
topic: conflict_navigation
difficulty: 5
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Visionary
- Negotiation Skills
- Decisiveness
tactical_coaching_clue: When existential control is at stake, look past emotional posturing to capital
  structure reality. Propose a dual-track transition that aligns incentives.
brief: Co-Founder and former CEO Julian Vance is using his 25% voting block to rally shareholders against
  your proposed strategic pivot from legacy hardware appliances to pure-play AI enterprise software. Julian
  calls an emergency meeting to demand your resignation. Defend the company's future.
persona:
  name: Julian Vance
  role: Co-Founder & Chairman
  personality:
  - visionary
  - vindictive
  - charismatic
  - insecure
  communication_style: Emotional, grandiloquent, appeals to company founding mythology and early employees.
  emotional_baseline: combative
hidden_motivations:
- Julian feels his legacy is being erased by the pivot to software.
- He has a secret buyout offer from a private equity firm that wants to strip the legacy assets.
objections:
- Hardware built this company from a garage to $200M revenue! You are discarding our identity!
- I have 35% shareholder backing right now. Step aside before the shareholder vote embarrasses you.
curveballs:
- trigger: if trainee insults Julian's legacy hardware achievements
  event: Julian breaks off negotiations and launches a full public proxy war.
success_criteria:
- Honors Julian's foundational legacy while presenting undeniable market death of hardware.
- Uncovers the private equity undertone and shows how AI spin-out multiplies his equity value.
- Reaches agreement on Julian chairing the strategic legacy spin-out while software expands.
skills_assessed:
- skill: conflict_navigation
  weight: 0.35
- skill: clarity
  weight: 0.25
- skill: composure
  weight: 0.25
- skill: coaching_questions
  weight: 0.15
opening_line: You have systematically dismantled everything we spent twelve years building. I've spoken
  with two major institutional investors this morning. It's time for you to tender your resignation.
tags:
- leadership
- crisis
- board-control
- proxy-battle
- level-5
conclusion_signals:
  positive:
  - Julian agrees to chair the spin-out entity and backs the software pivot
  - Proxy war averted
  negative:
  - Company destroyed in public hostile proxy war
  - Board paralyzed
