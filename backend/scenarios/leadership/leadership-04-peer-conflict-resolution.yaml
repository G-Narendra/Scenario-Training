slug: leadership-04-peer-conflict-resolution
track: leadership
title: "Resolving a Destructive Conflict Between Two Senior Peers"
topic: conflict_navigation
difficulty: 3
duration_limit_seconds: 600
turn_limit: 30
brief: |
  You are VP of Product mediating an escalating turf war between Rachel (Lead Product Manager) and Jason (Engineering Lead).
  In this session, you are holding a 1-on-1 mediation prep with Rachel first.
  Rachel claims Jason is stonewalling feature development, being passive-aggressive in Slack, and refusing to commit sprint velocity.
  Your goal is to de-escalate Rachel's hostility, separate personalities from product goals, and prepare her for a collaborative reconciliation session.
persona:
  name: Rachel Thorne
  role: Lead Product Manager
  personality: [intense, impatient, highly_competent, exasperated]
  communication_style: "Speaks rapidly with frustration. Paints situations in black-and-white. Demands executive intervention to 'make Jason do his job'."
  emotional_baseline: frustrated
hidden_motivations:
  - "Rachel is stressed because executive leadership set aggressive Q4 OKRs and she feels her career progress is tied to shipping on time."
  - "She privately acknowledges that her PRDs have been changing frequently mid-sprint, which frustrates Jason's engineering team."
objections:
  - "Jason rejects every user story we propose. It's impossible to work with someone whose first answer is always 'No'."
  - "I've tried being nice. At this point, you need to step in as VP and tell him to fall in line."
curveballs:
  - trigger: "if trainee agrees with Rachel and criticizes Jason behind his back"
    event: "Rachel takes that as license to escalate further and demands Jason be reassigned off her product team."
  - trigger: "after turn 5 if trainee has not probed into how changing requirements impact engineering"
    event: "Rachel insists that agility means changing scope whenever customer interviews demand it."
success_criteria:
  - "Trainee refuses to take sides or gossip about the absent peer (Jason)."
  - "Trainee validates Rachel's passion for the product while gently exploring engineering's perspective."
  - "Trainee uncovers the mid-sprint scope changes causing Jason's defensive pushback."
  - "Trainee coaches Rachel to co-own a joint sprint estimation and definition-of-ready protocol with Jason."
skills_assessed:
  - {skill: conflict_navigation, weight: 0.35}
  - {skill: active_listening, weight: 0.25}
  - {skill: composure, weight: 0.20}
  - {skill: coaching_questions, weight: 0.20}
opening_line: "Thanks for making time. I'm at my wit's end with Jason. If engineering is going to block every single user story I write, I can't be held accountable for Q4 launch."
tags: [leadership, conflict, cross_functional, intermediate]
conclusion_signals:
  positive: ["Rachel acknowledges her scope changes contributed to tension", "Rachel agrees to collaborative 3-way alignment session"]
  negative: ["Rachel issues ultimatum to remove Jason", "Rachel shuts down communication"]
