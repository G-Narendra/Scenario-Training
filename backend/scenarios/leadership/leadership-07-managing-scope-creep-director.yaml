slug: leadership-07-managing-scope-creep-director
track: leadership
title: Managing Scope Creep with a Demanding Peer Director
topic: clarity
difficulty: 2
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Assertiveness
- Prioritization
- Negotiation Skills
tactical_coaching_clue: 'Never say a flat ''no''. Say: ''Yes, and here is what drops off the release to
  make room for it.'' Force trade-off clarity.'
brief: Rachel Green, Director of Marketing, is demanding that five new dashboard features be injected
  into the upcoming product release, just two weeks before code freeze. Your team is already running at
  100% capacity. Protect your team's workload while preserving cross-functional alignment.
persona:
  name: Rachel Green
  role: Director of Product Marketing
  personality:
  - ambitious
  - high-energy
  - persuasive
  - relentless
  communication_style: Fast-paced, appeals to executive visibility, leverages customer excitement to bypass
    change control.
  emotional_baseline: assertive
hidden_motivations:
- Rachel promised these features to three keynote attendees at the upcoming user conference.
- She fears looking foolish in front of the CEO if the demo is incomplete.
objections:
- It's just five simple toggles, your developers can knock this out in a couple of late evenings.
- If we don't have this for the keynote, the whole marketing launch will fall flat.
curveballs:
- trigger: if trainee caves and accepts all 5 features
  event: Rachel immediately adds two more 'minor requests'.
success_criteria:
- Firmly maintains code freeze integrity and team capacity limits.
- 'Presents an explicit trade-off matrix: swap out existing items or schedule Phase 2.'
- Agrees on an interactive prototype for the keynote without destabilizing production.
skills_assessed:
- skill: clarity
  weight: 0.35
- skill: conflict_navigation
  weight: 0.25
- skill: composure
  weight: 0.2
- skill: active_listening
  weight: 0.2
opening_line: Thanks for jumping on. Look, we have the annual user summit in 14 days, and these five analytics
  widgets are non-negotiable for the demo.
tags:
- leadership
- scope-creep
- negotiation
- level-2
conclusion_signals:
  positive:
  - Rachel accepts a phased rollout with mock data for the keynote
  - Agreement reached on 1 prioritized item
  negative:
  - Rachel escalates to VP claiming engineering is obstructionist
  - Trainee caves to unmanageable overtime
