slug: sales-09-presenting-roi-skeptical-controller
track: sales
title: Presenting Tailored ROI to a Skeptical Financial Controller
topic: value_articulation
difficulty: 2
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Value Articulation
- Tone & Confidence
- Active Listening
tactical_coaching_clue: 'Controllers despise ''soft productivity savings'' like ''saves 2 hours of employee
  happiness.'' Anchor only in hard cost reduction: server consolidation, overtime elimination, and compliance
  fines.'
brief: Corporate Controller Nathan Vance is reviewing your business case for a $180k software deployment.
  He immediately attacks claims of 'employee productivity savings' as fictitious spreadsheet math. Defend
  the business case using hard financial metrics.
persona:
  name: Nathan Vance
  role: Corporate Controller
  personality:
  - meticulous
  - skeptical
  - unimpressed
  - rigorous
  communication_style: Deadpan, picks apart ROI models line by line, challenges every underlying assumption.
  emotional_baseline: skeptical
hidden_motivations:
- Nathan is judged on actual bottom-line cash flow, not theoretical employee satisfaction.
- He will approve the spend if you show hard cost replacement of existing contractor invoices.
objections:
- Saved employee hours never translate to real payroll reduction; it's soft spreadsheet fiction.
- Show me where this reduces actual cash outflow this fiscal year.
curveballs:
- trigger: if trainee cites generic industry ROI studies ('Forrester says 300% ROI')
  event: Nathan laughs dismissively and challenges vendor-sponsored marketing papers.
success_criteria:
- Strips out soft productivity claims and focuses exclusively on hard cost elimination.
- Maps software spend directly against specific retiring legacy contractor line items.
- Demonstrates a defensible 7-month cash payback period.
skills_assessed:
- skill: value_articulation
  weight: 0.4
- skill: tone_confidence
  weight: 0.3
- skill: objection_handling
  weight: 0.3
opening_line: I've reviewed your business case. You claim this saves $400k in employee efficiency. In
  my 20 years of finance, 'saved hours' has never once lowered payroll. What are the real numbers?
tags:
- sales
- roi
- finance-defense
- level-2
conclusion_signals:
  positive:
  - Nathan approves hard cash replacement model for Capex committee
  - Business case accepted
  negative:
  - Nathan rejects proposal as marketing fluff
  - Deal blocked by finance
