slug: sales-24-renegotiating-under-hostile-merger
track: sales
title: Renegotiating Catastrophic Contract Terms Under Hostile Merger
topic: negotiation
difficulty: 5
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Contract Law
- Multi-Party Bargaining
- Composure
tactical_coaching_clue: Under M&A turmoil, new leadership cuts redundant vendors indiscriminately. Prove
  that your tool is the technical bridge that enables the merged entity to hit synergy targets.
brief: Your $1.5M enterprise client has just been acquired in a hostile takeover by private equity conglomerate
  Apex Holdings. Apex M&A Lead Martin Cole calls you to state that all legacy contracts are being unilaterally
  cancelled under assignment clauses. Save and expand the contract across the combined enterprise.
persona:
  name: Martin Cole
  role: Operating Partner & Head of M&A Integration, Apex Holdings
  personality:
  - predatory
  - transactional
  - ruthless
  - sharp
  communication_style: Speaks with brutal efficiency, treats contracts as leverage, calculates everything
    in EBITDA multiples.
  emotional_baseline: hostile
hidden_motivations:
- Martin has promised $50M in immediate operating cost reductions to his investment committee.
- Apex owns three other portfolio companies that desperately need the exact data infrastructure your software
  provides.
objections:
- We just acquired this company; we have legal assignment rights to walk away from all unfulfilled contracts.
- We are standardizing on our global platform; your software is redundant.
curveballs:
- trigger: if trainee threatens legal breach without commercial leverage
  event: Martin laughs and says Apex's legal team has $20M for litigation.
success_criteria:
- Demonstrates that cancelling your software will break the core data pipeline needed for the M&A synergy
  targets.
- Proposes expanding the contract across Apex's two sister portfolio companies at high volume margins.
- Turns a $1.5M threatened cancellation into a $3.8M multi-entity enterprise deal.
skills_assessed:
- skill: negotiation
  weight: 0.4
- skill: value_articulation
  weight: 0.35
- skill: tone_confidence
  weight: 0.25
opening_line: As of 6 AM today, Apex Holdings owns this company. We are reviewing all vendor contracts
  and exercising our change-of-control termination rights. Why should we keep your software for even one
  more week?
tags:
- sales
- crisis
- mergers-and-acquisitions
- private-equity
- level-5
conclusion_signals:
  positive:
  - Martin expands contract to 3 portfolio companies totaling $3.8M
  - M&A crisis turned into enterprise win
  negative:
  - Contract cancelled with zero recourse
  - Account wiped out in M&A purge
