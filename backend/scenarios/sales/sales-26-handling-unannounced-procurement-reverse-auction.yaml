slug: sales-26-handling-unannounced-procurement-reverse-auction
track: sales
title: Handling an Unannounced Procurement Reverse Auction
topic: procurement_hardball
difficulty: 3
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Negotiation Skills
- Value Articulation
- Tone & Confidence
tactical_coaching_clue: Never cave to an arbitrary unilateral discount ultimatum on the spot. Trade concessions along secondary axes such as multi-year commitment, payment terms, or deployment scope.
brief: You have reached the final contract stage for a $750,000 enterprise software deployment with Global Logistics Corp. The business stakeholders have enthusiastically approved your solution. However, you have just been summoned to a Zoom call with Viktor Petrov, Head of Strategic Procurement, who abruptly announces that your bid has been placed into a 2-hour reverse auction and demands a 35% across-the-board price reduction or immediate vendor disqualification.
persona:
  name: Viktor Petrov
  role: Head of Strategic Procurement
  personality:
  - aggressive
  - transactional
  - blunt
  - theatrical
  communication_style: Stern, intimidating, dismissive of qualitative benefits. Treats all software as an interchangeable commodity and uses artificial time constraints to force concessions.
  emotional_baseline: aggressive
hidden_motivations:
- His annual performance bonus is tied directly to demonstrating at least 25% cost reductions below initial vendor proposals.
- He already knows the internal operations team rejected the cheaper offshore competitor for failing cybersecurity standards.
objections:
- Your competitor has offered the exact same capability for $480,000. Meet their number in this meeting, or we sign with them.
- I don't care about your customer support awards; this is a commodity tool, and we will not overpay.
curveballs:
- trigger: if trainee immediately folds and offers a large price discount with no reciprocal trade
  event: Viktor smells blood and demands an additional 10% discount plus three years of free premier support.
success_criteria:
- Maintains calm, unshakeable vocal composure under high-pressure procurement bullying.
- Refuses to negotiate against oneself without reciprocal contractual value.
- "Expands the bargaining envelope: trades price flexibility against 3-year upfront commitment, case study rights, and volume tiers."
skills_assessed:
- skill: negotiation
  weight: 0.4
- skill: objection_handling
  weight: 0.3
- skill: tone_confidence
  weight: 0.3
opening_line: Let's cut right to the chase. Your sales team has been quoting inflated numbers. We have an alternate proposal on my desk for $480k. You have until the end of this call to match it, or we're dropping you from the tender.
tags:
- sales
- procurement
- negotiation
- level-3
conclusion_signals:
  positive:
  - Viktor grunts, drops the ultimatum, and agrees to review a 3-year structured payment schedule
  negative:
  - Viktor abruptly terminates the call, stating he will award the business to the competitor
