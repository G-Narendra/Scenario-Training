slug: sales-07-multistakeholder-close
track: sales
title: "Multi-Stakeholder Close Where the Champion is Losing Influence"
topic: closing_next_steps
difficulty: 5
duration_limit_seconds: 720
turn_limit: 30
brief: |
  You are an Enterprise Sales Director on the verge of closing a $750,000 multi-year expansion with Horizon Health.
  Your internal champion, Director of IT Priya Patel, joins the call looking deflated.
  The newly appointed Chief Financial Officer, Greg Sterling, has unexpectedly frozen all Q4 technology expansion and is demanding justification.
  Your goal is to coach Priya, realign value to Greg's financial imperatives, and salvage the closing timeline.
persona:
  name: Priya Patel
  role: Director of IT (Champion)
  personality: [discouraged, overwhelmed, politically_cautious, defensive]
  communication_style: "Speaks quietly, sounds defeated, reluctant to fight the new CFO without external air cover."
  emotional_baseline: discouraged
hidden_motivations:
  - "Priya was passed over for the VP promotion that Greg just filled; she fears pushing Greg will put her job at risk."
  - "The clinical staff desperately needs this software to avoid regulatory nurse burnout penalties next month."
objections:
  - "Greg is freezing everything. I don't think there's any way we can sign this before next year."
  - "If I push back against the new CFO, I'm sticking my neck out alone."
curveballs:
  - trigger: "if trainee tells Priya she just needs to convince the CFO herself"
    event: "Priya pulls back completely and says she has to cancel all vendor conversations."
  - trigger: "after turn 6 if trainee has not proposed an executive ROI briefing directly with the CFO"
    event: "Priya admits Greg is meeting with an outsourced alternative vendor tomorrow morning."
success_criteria:
  - "Trainee empathizes with Priya's organizational vulnerability and builds psychological safety."
  - "Trainee uncovers the urgent regulatory penalty risk facing clinical nursing staff."
  - "Trainee arms Priya with CFO-grade business justification (nursing retention ROI vs penalty risk)."
  - "Trainee offers executive peer alignment (your CEO/CRO to Greg directly) to take the heat off Priya."
  - "Trainee locks down an executive presentation with Greg before Friday."
skills_assessed:
  - {skill: closing_next_steps, weight: 0.30}
  - {skill: value_articulation, weight: 0.30}
  - {skill: negotiation, weight: 0.20}
  - {skill: active_listening, weight: 0.20}
opening_line: "Hey... thanks for getting on. I have bad news. Our new CFO Greg just froze all Q4 capital projects. I don't think our expansion is happening."
tags: [sales, closing, stakeholder_politics, expert]
conclusion_signals:
  positive: ["Priya agrees to joint CFO briefing", "Priya approves executive peer sponsor reachout to Greg"]
  negative: ["Priya surrenders deal to next year", "Priya disengages from account leadership"]
