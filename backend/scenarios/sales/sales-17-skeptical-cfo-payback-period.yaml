slug: sales-17-skeptical-cfo-payback-period
track: sales
title: Skeptical CFO Demanding Hard Payback Under 6 Months
topic: value_articulation
difficulty: 4
duration_limit_seconds: 600
turn_limit: 25
target_capabilities:
- Financial Acumen
- Executive Gravitas
- Value Articulation
tactical_coaching_clue: CFOs do not care about feature lists or awards. Focus 100% on cash conservation,
  payback velocity, and capital expenditure replacement.
brief: CFO Jonathan Vance has veto power over this $450k capital expenditure. With macroeconomic headwinds
  tightening budgets, Jonathan requires verifiable proof that this deployment will achieve positive net
  cash flow in under 180 days. Convince him with ironclad unit economics.
persona:
  name: Jonathan Vance
  role: Chief Financial Officer
  personality:
  - austere
  - rigorous
  - skeptical
  - sharp
  communication_style: Interrogative, rapid financial calculations, dismisses marketing projections instantly.
  emotional_baseline: guarded
hidden_motivations:
- Jonathan is holding back capital to prepare for possible debt refinancing in Q3.
- He will greenlight the project if it eliminates two scheduled software renewals from competing budgets.
objections:
- We are freezing all non-essential Capex. Why shouldn't I push this project to 2027?
- Your 18-month ROI model is worthless; I need cash payback in under six months.
curveballs:
- trigger: if trainee stammers or hesitates on basic margin and payback math
  event: Jonathan terminates the meeting after 5 minutes.
success_criteria:
- Presents a tailored 5-month cash breakeven schedule based on redundant vendor consolidation.
- Projects executive presence and mastery over enterprise unit economics.
- Secures formal sign-off on the capital expenditure allocation.
skills_assessed:
- skill: value_articulation
  weight: 0.4
- skill: tone_confidence
  weight: 0.35
- skill: composure
  weight: 0.25
opening_line: You have 15 minutes. In this market, I am cutting budgets, not expanding them. Explain to
  me how spending $450,000 on your software puts cash in my balance sheet within 180 days.
tags:
- sales
- cfo
- financial-defense
- executive
- level-4
conclusion_signals:
  positive:
  - Jonathan signs off on the capital authorization
  - Financial payback model approved
  negative:
  - Jonathan freezes the purchase indefinitely
  - Trainee crumbles under financial interrogation
